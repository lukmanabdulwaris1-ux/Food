<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e85d04" />
      <stop offset="100%" style="stop-color:#f48c06" />
    </linearGradient>
    <linearGradient id="plateG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#f0e8d8" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.25)" />
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="192" height="192" rx="40" ry="40" fill="url(#bgG)" />

  <!-- Subtle inner glow ring -->
  <rect width="192" height="192" rx="40" ry="40"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Plate shadow -->
  <ellipse cx="96" cy="128" rx="54" ry="12" fill="rgba(0,0,0,0.18)" />

  <!-- Plate -->
  <circle cx="96" cy="112" r="52" fill="url(#plateG)" filter="url(#shadow)" />
  <circle cx="96" cy="112" r="44" fill="#fff8f0" />
  <!-- Plate rim detail -->
  <circle cx="96" cy="112" r="52" fill="none" stroke="rgba(232,93,4,0.2)" stroke-width="2" />

  <!-- Fork -->
  <rect x="34" y="52" width="7" height="44" rx="3.5" fill="#ffffff" opacity="0.95" />
  <rect x="31" y="52" width="4" height="22" rx="2" fill="#ffffff" opacity="0.95" />
  <rect x="37" y="52" width="4" height="22" rx="2" fill="#ffffff" opacity="0.95" />
  <rect x="34" y="52" width="7" height="3" rx="1.5" fill="rgba(255,255,255,0.5)" />

  <!-- Knife -->
  <rect x="151" y="52" width="7" height="44" rx="3.5" fill="#ffffff" opacity="0.95" />
  <path d="M151 52 Q160 64 158 76 L151 76 Z" fill="#ffffff" opacity="0.95" />

  <!-- Steam -->
  <path d="M78 44 Q82 36 78 28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M96 40 Q100 32 96 24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M114 44 Q118 36 114 28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.65"/>

  <!-- Food: rice mound -->
  <ellipse cx="96" cy="108" rx="28" ry="16" fill="#f5c842" />
  <ellipse cx="96" cy="102" rx="22" ry="11" fill="#f7d060" />
  <ellipse cx="96" cy="98" rx="16" ry="7" fill="#fad96a" />

  <!-- Rice texture dots -->
  <circle cx="86" cy="104" r="2.5" fill="#e8b830" />
  <circle cx="93" cy="100" r="2.5" fill="#e8b830" />
  <circle cx="100" cy="103" r="2.5" fill="#e8b830" />
  <circle cx="107" cy="106" r="2.5" fill="#e8b830" />
  <circle cx="89" cy="109" r="2" fill="#e8b830" />
  <circle cx="96" cy="107" r="2" fill="#e8b830" />
  <circle cx="103" cy="109" r="2" fill="#e8b830" />

  <!-- Small stew splash -->
  <ellipse cx="82" cy="114" rx="6" ry="3" fill="#c0392b" opacity="0.7" />
  <ellipse cx="110" cy="116" rx="5" ry="2.5" fill="#c0392b" opacity="0.7" />

  <!-- Brand text -->
  <text x="96" y="158" font-family="'Arial Black', Arial, sans-serif"
        font-size="22" font-weight="900" text-anchor="middle"
        fill="#ffffff" letter-spacing="1">AyoFoods</text>
</svg>
