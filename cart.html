<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — AyoFoods</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">🍽️ Ayo<span class="accent">Foods</span></a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#menu">Menu</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="cart-btn" id="cartBtn">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<main class="page-main">
  <div class="container">
    <div class="page-header">
      <h1>Your <span class="accent">Cart</span></h1>
      <a href="index.html#menu" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
    </div>

    <div class="cart-layout" id="cartLayout">
      <!-- Populated by JS -->
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
