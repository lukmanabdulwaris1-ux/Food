<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout — AyoFoods</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">🍽️ Ayo<span class="accent">Foods</span></a>
    <div class="nav-actions">
      <a href="cart.html" class="cart-btn" id="cartBtn">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </div>
</nav>

<main class="page-main">
  <div class="container">
    <div class="page-header">
      <h1>Check<span class="accent">out</span></h1>
      <a href="cart.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Cart</a>
    </div>

    <div class="checkout-layout">
      <!-- Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="summaryItems"></div>
        <div class="summary-totals" id="summaryTotals"></div>
      </div>

      <!-- Checkout Form -->
      <form class="checkout-form" id="checkoutForm" onsubmit="placeOrder(event)">
        <h3>Delivery Details</h3>
        <div class="form-group">
          <label for="cName">Full Name *</label>
          <input type="text" id="cName" placeholder="Enter your full name" required/>
        </div>
        <div class="form-group">
          <label for="cPhone">Phone Number *</label>
          <input type="tel" id="cPhone" placeholder="+234 800 000 0000" required/>
        </div>
        <div class="form-group">
          <label for="cAddress">Delivery Address *</label>
          <textarea id="cAddress" rows="3" placeholder="Enter your full delivery address" required></textarea>
        </div>
        <div class="form-group">
          <label>Payment Method *</label>
          <div class="payment-options">
            <label class="pay-opt">
              <input type="radio" name="payment" value="cash" checked/>
              <span><i class="fas fa-money-bill-wave"></i> Cash on Delivery</span>
            </label>
            <label class="pay-opt">
              <input type="radio" name="payment" value="transfer"/>
              <span><i class="fas fa-university"></i> Bank Transfer</span>
            </label>
            <label class="pay-opt">
              <input type="radio" name="payment" value="card"/>
              <span><i class="fas fa-credit-card"></i> Card Payment</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="placeOrderBtn">
          <i class="fas fa-check-circle"></i> Place Order
        </button>
      </form>
    </div>
  </div>
</main>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h2>Order Placed!</h2>
    <p id="modalMsg">Your order has been received. We'll prepare it right away!</p>
    <p class="order-id-display" id="orderIdDisplay"></p>
    <a href="index.html" class="btn btn-primary">Back to Home</a>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
